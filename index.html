<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>スケジュール管理</title>
  
  <!-- Cordovaスクリプト -->
  <script src="cordova.js"></script>
  
  <!-- Monaca Backend SDK の読み込み -->
  <script src="components/monaca-nifty-cloud/niftycloud.js"></script>
  
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>📅 スケジュール管理</h1>
    </header>

    <main class="app-main">
      <!-- カレンダー表示セクション -->
      <section class="calendar-section">
        <div class="calendar-header">
          <button id="btn-prev-month" type="button" class="btn-icon">＜</button>
          <h2 id="calendar-title">2026年 10月</h2>
          <button id="btn-next-month" type="button" class="btn-icon">＞</button>
        </div>
        
        <div class="calendar-weekdays">
          <div class="sun">日</div>
          <div>月</div>
          <div>火</div>
          <div>水</div>
          <div>木</div>
          <div>金</div>
          <div class="sat">土</div>
        </div>
        
        <div id="calendar-grid" class="calendar-grid"></div>
      </section>

      <!-- 予定追加フォーム -->
      <section class="form-section">
        <h2>新しい予定を追加</h2>
        
        <button type="button" id="btn-notification-permission" class="btn-secondary">通知を許可する</button>

        <form id="schedule-form">
          <div class="form-row">
            <div class="form-group flex-1">
              <label for="date">日付</label>
              <input type="date" id="date" required>
            </div>
            <div class="form-group flex-1">
              <label for="time">時間</label>
              <input type="time" id="time" required>
            </div>
          </div>

          <div class="form-group">
            <label for="title">予定の内容</label>
            <div class="input-with-btn">
              <input type="text" id="title" placeholder="例: 打ち合わせ、買い物" required>
              <button type="button" id="btn-voice-input" class="btn-voice" title="音声入力">🎤</button>
            </div>
          </div>

          <button type="submit" class="btn-primary btn-block">追加する</button>
        </form>
      </section>

      <!-- 選択日の予定一覧表示 -->
      <section class="list-section">
        <h2 id="selected-date-heading">予定一覧</h2>
        <ul id="schedule-list" class="schedule-list"></ul>
      </section>
    </main>
  </div>

  <!-- 確認用モーダル -->
  <div id="confirm-modal" class="modal-backdrop" style="display: none;">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3>登録内容の確認</h3>
      </div>
      <div class="modal-body">
        <p id="confirm-message"></p>
      </div>
      <div class="modal-footer">
        <button id="btn-modal-cancel" type="button" class="btn-secondary">キャンセル</button>
        <button id="btn-modal-confirm" type="button" class="btn-primary">確定する</button>
      </div>
    </div>
  </div>


  <script src="js/app.js"></script>
</body>
</html>
